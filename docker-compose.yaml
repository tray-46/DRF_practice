services:
  db:
    image: postgres:16.0
    container_name: dogs-db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tray -d dogs"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    container_name: drf-dogs
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - static_data:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PG_HOST=dogs-db
      - PG_DBNAME=dogs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  static_data: